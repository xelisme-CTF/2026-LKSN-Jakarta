worker_processes 1;
daemon off;
pid /tmp/antek-nginx.pid;
error_log stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    server_tokens off;
    absolute_redirect off;

    client_body_temp_path /tmp/ngx-client;
    proxy_temp_path       /tmp/ngx-proxy;
    fastcgi_temp_path     /tmp/ngx-fastcgi;
    uwsgi_temp_path       /tmp/ngx-uwsgi;
    scgi_temp_path        /tmp/ngx-scgi;

    upstream antek_app {
        server 127.0.0.1:3000;
    }

    server {
        listen 127.0.0.1:8080;
        server_name _;

        location /assets/ {
            alias /app/app/public/;
            expires 10m;
        }

        location /static/ {
            root /app;
        }

        location = /members/posts/quarterly-briefing {
            proxy_pass http://antek_app/members/posts/quarterly-briefing;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://antek_app;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
